<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiraCanchera: el mapa de las canchas que visitaste</title>
    <meta name="description" content="Registrá las canchas que visitás, reseñá cada partido con fotos y puntaje, y explorá estadios de todo el mundo en un mapa." />
    <meta name="theme-color" content="#0D1117" />

    <!--
      CSP: segunda línea de defensa contra XSS. style-src necesita 'unsafe-inline'
      porque la app usa style={{...}} de React en casi todos los componentes
      (son atributos style="" en el DOM, CSP los trata como "inline" igual que un
      <style> en el HTML). connect-src incluye localhost:5000 para dev; agregar acá
      el dominio real del backend cuando esté en producción.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:5000; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    />

    <!-- Open Graph y Twitter: cómo se ve el link al compartirlo -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GiraCanchera" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="GiraCanchera: el mapa de las canchas que visitaste" />
    <meta property="og:description" content="Registrá las canchas que visitás, reseñá cada partido con fotos y puntaje, y explorá estadios de todo el mundo en un mapa." />
    <!-- TODO: agregar og:url y og:image (URL absoluta, ej. 1200x630) cuando esté el dominio de producción -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GiraCanchera: el mapa de las canchas que visitaste" />
    <meta name="twitter:description" content="Registrá las canchas que visitás, reseñá cada partido con fotos y puntaje, y explorá estadios de todo el mundo en un mapa." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
